services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: repopulse
      MYSQL_USER: repopulse
      MYSQL_PASSWORD: repopulse
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "repopulse", "--password=repopulse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: mysql+pymysql://repopulse:repopulse@db:3306/repopulse
      # Set GITHUB_TOKEN in your shell or a .env file — never commit secrets
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
